# Used by the Mypy step of .github/workflows/test_pypi.yml (run from this
# directory). Upstream does not type-check its tests with mypy, so silence the
# errors in upstream test files here instead of editing them, which would
# conflict on every rebase.
[mypy]

[mypy-test_theory]
disable_error_code = func-returns-value, var-annotated
